# OEHTB-Suite Reverse-Proxy.
#
# Pfad-Layout:
#   /                -> Portal (Suite-Backend liefert SPA + /api/suite/...)
#   /handkassen/...  -> Handkassen-App (Praefix wird GESTRIPPT: Backend bleibt wurzel-relativ)
#   /stunden/...     -> Stunden-App    (Praefix wird GESTRIPPT)
#
# Die Frontends sind mit Vite base "/handkassen/" bzw. "/stunden/" gebaut,
# ihre Asset-/API-URLs tragen also den Praefix; nginx entfernt ihn beim
# Weiterreichen. Neues Tool anbinden = ein weiterer location-Block nach
# demselben Muster + Eintrag in der Tool-Registry der Suite.

server {
    listen 80;
    server_name _;

    # Belegfotos (Handkassen) koennen groesser sein.
    client_max_body_size 25m;

    # Docker-interner DNS-Resolver. Zusammen mit Variablen in proxy_pass (unten)
    # loest nginx die Upstream-IPs zur Laufzeit neu auf, statt sie beim Start
    # einmalig zu cachen. Verhindert 502 nach Neubau einzelner App-Container
    # (die dabei neue Container-IPs bekommen).
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Proxy-eigener Health-Endpunkt --------------------------------------
    # Antwortet lokal in nginx, ohne einen Upstream anzufragen. Dient dem
    # Docker-Healthcheck des Proxy-Containers (ist nginx selbst erreichbar?).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # --- Interne Endpunkte NIE nach aussen ----------------------------------
    # Die User-Provisionierung (Suite -> Tools) laeuft ausschliesslich im
    # Docker-Netz. Von aussen ueber diesen Proxy ist sie tabu. Regex-Locations
    # haben Vorrang vor den Praefix-Blocks unten, greifen also zuerst; interne
    # Container-zu-Container-Aufrufe gehen direkt an die App und sind unberuehrt.
    location ~ ^/(handkassen|stunden|foerderungen)/api/provision(/|$) { return 404; }
    location ~ ^/api/suite/provision(/|$) { return 404; }

    # --- Handkassen ---------------------------------------------------------
    # Ohne abschliessenden Slash auf /handkassen -> Redirect auf /handkassen/
    location = /handkassen {
        return 301 /handkassen/;
    }
    location /handkassen/ {
        # Praefix per rewrite entfernen (/handkassen/api/x -> /api/x); die
        # Variable erzwingt dynamische DNS-Aufloesung ueber den resolver oben.
        set $upstream_handkassen http://handkassen-app:3001;
        rewrite ^/handkassen/(.*)$ /$1 break;
        proxy_pass $upstream_handkassen;
    }

    # --- Stunden --------------------------------------------------------------
    location = /stunden {
        return 301 /stunden/;
    }
    location /stunden/ {
        set $upstream_stunden http://stunden-app:3002;
        rewrite ^/stunden/(.*)$ /$1 break;
        proxy_pass $upstream_stunden;
    }

    # --- Foerderungen ---------------------------------------------------------
    location = /foerderungen {
        return 301 /foerderungen/;
    }
    location /foerderungen/ {
        set $upstream_foerderungen http://foerderungen-app:3003;
        rewrite ^/foerderungen/(.*)$ /$1 break;
        proxy_pass $upstream_foerderungen;
    }

    # --- Portal (Standard: alles Uebrige, inkl. /api/suite und /verwaltung) --
    location / {
        set $upstream_portal http://portal-app:3000;
        proxy_pass $upstream_portal;
    }
}
