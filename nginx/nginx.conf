# OEHTB-Suite Reverse-Proxy.
#
# Pfad-Layout:
#   /                -> Portal (Suite-Backend liefert SPA + /api/suite/...)
#   /handkassen/...  -> Handkassen-App (Praefix wird GESTRIPPT: Backend bleibt wurzel-relativ)
#   /stunden/...     -> Stunden-App    (Praefix wird GESTRIPPT)
#
# Die Frontends sind mit Vite base "/handkassen/" bzw. "/stunden/" gebaut,
# ihre Asset-/API-URLs tragen also den Praefix; nginx entfernt ihn beim
# Weiterreichen. Neues Tool anbinden = ein weiterer location-Block nach
# demselben Muster + Eintrag in der Tool-Registry der Suite.

server {
    listen 80;
    server_name _;

    # Belegfotos (Handkassen) koennen groesser sein.
    client_max_body_size 25m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Handkassen ---------------------------------------------------------
    # Ohne abschliessenden Slash auf /handkassen -> Redirect auf /handkassen/
    location = /handkassen {
        return 301 /handkassen/;
    }
    location /handkassen/ {
        # Trailing Slash am proxy_pass entfernt das Praefix:
        # /handkassen/api/x -> /api/x
        proxy_pass http://handkassen-app:3001/;
    }

    # --- Stunden --------------------------------------------------------------
    location = /stunden {
        return 301 /stunden/;
    }
    location /stunden/ {
        proxy_pass http://stunden-app:3002/;
    }

    # --- Portal (Standard: alles Uebrige, inkl. /api/suite und /verwaltung) --
    location / {
        proxy_pass http://portal-app:3000;
    }
}
