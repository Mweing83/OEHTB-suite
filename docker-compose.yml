# OEHTB-Suite: Gesamt-Deployment.
#
# ENTWICKLUNG:  docker compose up -d
#   -> startet NUR suite-db (Handkassen-/Stunden-DBs laufen wie bisher aus
#      den jeweiligen Projektordnern; Apps per "npm run dev").
#
# PRODUKTION:   docker compose --profile produktion up -d --build
#   -> startet alles: nginx (Port 80), Portal, beide Tools, drei DBs, Backup.
#
# WICHTIG (Cutover vom alten Handkassen-Server): Die Volumes der bestehenden
# Handkassen-Installation werden ueber explizite "name:"-Eintraege
# weiterverwendet (handkassen_db_data, handkassen_belege_data). Dadurch
# uebernimmt die Suite die vorhandenen Produktivdaten.

# Gemeinsame Log-Rotation: pro Container max. 3 Dateien à 10 MB (=30 MB Deckel),
# damit die Container-Logs die Serverplatte nicht unbegrenzt vollschreiben.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Suite-Datenbank (laeuft auch in der Entwicklung)
  # ---------------------------------------------------------------------------
  suite-db:
    image: postgres:16-alpine
    container_name: suite-db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${SUITE_DB_USER:-suite}
      POSTGRES_PASSWORD: ${SUITE_DB_PASSWORD:-suite_dev_passwort}
      POSTGRES_DB: ${SUITE_DB_NAME:-suite}
    volumes:
      - suite_db_data:/var/lib/postgresql/data
    ports:
      # Nur lokal am Server erreichbar (Admin-Tooling), nicht im LAN/Internet.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUITE_DB_USER:-suite}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Reverse-Proxy: einziger veroeffentlichter Port der Suite
  # ---------------------------------------------------------------------------
  proxy:
    profiles: ["produktion"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    # Erst starten, wenn alle Apps ihren Healthcheck bestehen – sonst liefert der
    # Proxy beim Hochfahren 502, bis die Backends bereit sind.
    depends_on:
      portal-app:
        condition: service_healthy
      handkassen-app:
        condition: service_healthy
      stunden-app:
        condition: service_healthy
      foerderungen-app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    healthcheck:
      # Proxy-eigener Endpunkt (siehe nginx.conf) – prueft nur, ob nginx laeuft.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Portal (Suite-Backend + Portal-SPA)
  # ---------------------------------------------------------------------------
  portal-app:
    profiles: ["produktion"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      suite-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SUITE_DB_USER:-suite}:${SUITE_DB_PASSWORD:-suite_dev_passwort}@suite-db:5432/${SUITE_DB_NAME:-suite}
      JWT_SECRET: ${JWT_SECRET:-bitte-aendern}
      # Gemeinsames Geheimnis fuer die interne User-Provisionierung (Suite->Tools).
      PROVISION_SECRET: ${PROVISION_SECRET:-bitte-aendern-provision}
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY: "1"
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
      SESSION_TIMEOUT_MINUTEN: ${SESSION_TIMEOUT_MINUTEN:-15}
      STATIC_DIR: /app/static
    healthcheck:
      # Node hat ab v18 globales fetch – kein curl/wget im Slim-Image noetig.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/suite/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------------------------------------------------------------------
  # Handkassen (bestehendes Projekt, Build-Kontext ./handkassen)
  # ---------------------------------------------------------------------------
  handkassen-db:
    profiles: ["produktion"]
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${HK_DB_USER:-handkassen}
      POSTGRES_PASSWORD: ${HK_DB_PASSWORD:-handkassen}
      POSTGRES_DB: ${HK_DB_NAME:-handkassen}
    volumes:
      - handkassen_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HK_DB_USER:-handkassen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  handkassen-app:
    profiles: ["produktion"]
    build:
      context: ./handkassen
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      handkassen-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${HK_DB_USER:-handkassen}:${HK_DB_PASSWORD:-handkassen}@handkassen-db:5432/${HK_DB_NAME:-handkassen}
      JWT_SECRET: ${JWT_SECRET:-bitte-aendern}
      PROVISION_SECRET: ${PROVISION_SECRET:-bitte-aendern-provision}
      PORT: 3001
      NODE_ENV: production
      TRUST_PROXY: "1"
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
      # Suite-SSO: Slug dieses Tools + interne URL des Portals (Rechte-Refresh).
      TOOL_SLUG: handkassen
      SUITE_URL: http://portal-app:3000
      BACKUP_LOKAL_PFAD: /backups/lokal
    volumes:
      - handkassen_belege_data:/app/uploads
      - ${BACKUP_LOKAL:-./handkassen/backups}:/backups/lokal:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  handkassen-backup:
    profiles: ["produktion"]
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      handkassen-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${HK_DB_USER:-handkassen}
      POSTGRES_PASSWORD: ${HK_DB_PASSWORD:-handkassen}
      POSTGRES_DB: ${HK_DB_NAME:-handkassen}
      DB_HOST: handkassen-db
    entrypoint: ["/bin/sh", "/backup/entrypoint.sh"]
    volumes:
      - ./handkassen/backup:/backup:ro
      - handkassen_belege_data:/uploads:ro
      - ${BACKUP_LOKAL:-./handkassen/backups}:/backups/lokal
      - ${BACKUP_NAS:-./handkassen/backups-nas}:/backups/nas
      - ${BACKUP_USB:-./handkassen/backups-usb}:/backups/usb
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Stunden (bestehendes Projekt, Build-Kontext ./stunden)
  # ---------------------------------------------------------------------------
  stunden-db:
    profiles: ["produktion"]
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${STUNDEN_DB_USER:-stunden}
      POSTGRES_PASSWORD: ${STUNDEN_DB_PASSWORD:-stunden_dev_passwort}
      POSTGRES_DB: ${STUNDEN_DB_NAME:-stunden}
    volumes:
      - stunden_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STUNDEN_DB_USER:-stunden}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  stunden-app:
    profiles: ["produktion"]
    build:
      context: ./stunden
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      stunden-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${STUNDEN_DB_USER:-stunden}:${STUNDEN_DB_PASSWORD:-stunden_dev_passwort}@stunden-db:5432/${STUNDEN_DB_NAME:-stunden}
      JWT_SECRET: ${JWT_SECRET:-bitte-aendern}
      ENCRYPTION_KEY: ${STUNDEN_ENCRYPTION_KEY:-bitte-32-zeichen-schluessel-setzen}
      PROVISION_SECRET: ${PROVISION_SECRET:-bitte-aendern-provision}
      PORT: 3002
      NODE_ENV: production
      TRUST_PROXY: "1"
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
      TOOL_SLUG: stunden
      SUITE_URL: http://portal-app:3000
      STATIC_DIR: /app/static
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------------------------------------------------------------------
  # Foerderungen (Build-Kontext ./foerderungen)
  # ---------------------------------------------------------------------------
  foerderungen-db:
    profiles: ["produktion"]
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${FOERDERUNGEN_DB_USER:-foerderungen}
      POSTGRES_PASSWORD: ${FOERDERUNGEN_DB_PASSWORD:-foerderungen_dev_passwort}
      POSTGRES_DB: ${FOERDERUNGEN_DB_NAME:-foerderungen}
    volumes:
      - foerderungen_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FOERDERUNGEN_DB_USER:-foerderungen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  foerderungen-app:
    profiles: ["produktion"]
    build:
      context: ./foerderungen
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      foerderungen-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${FOERDERUNGEN_DB_USER:-foerderungen}:${FOERDERUNGEN_DB_PASSWORD:-foerderungen_dev_passwort}@foerderungen-db:5432/${FOERDERUNGEN_DB_NAME:-foerderungen}
      JWT_SECRET: ${JWT_SECRET:-bitte-aendern}
      ENCRYPTION_KEY: ${FOERDERUNGEN_ENCRYPTION_KEY:-bitte-aendern-32-zeichen-genau!!}
      PROVISION_SECRET: ${PROVISION_SECRET:-bitte-aendern-provision}
      PORT: 3003
      NODE_ENV: production
      TRUST_PROXY: "1"
      COOKIE_INSECURE: ${COOKIE_INSECURE:-}
      TOOL_SLUG: foerderungen
      SUITE_URL: http://portal-app:3000
      STATIC_DIR: /app/static
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  suite_db_data:
  # Bestehende Handkassen-Produktivdaten weiterverwenden (siehe Kopfkommentar).
  handkassen_db_data:
    name: handkassen_db_data
  handkassen_belege_data:
    name: handkassen_belege_data
  stunden_db_data:
    name: stunden_db_data
  foerderungen_db_data:
    name: foerderungen_db_data
