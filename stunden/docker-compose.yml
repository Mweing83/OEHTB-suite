# Stunden - NUR Entwicklungs-Datenbank.
#
# Der Produktivbetrieb laeuft ausschliesslich ueber die OEHTB-Suite
# (docker-compose.yml im Suite-Root, Profil "produktion"). Diese Datei
# startet lediglich eine lokale PostgreSQL-Instanz fuer "npm run dev":
#
#   docker compose up -d        (im Ordner stunden\)
#
# Bewusst KEIN App-Dienst mehr: ein versehentliches "--profile produktion up"
# in diesem Ordner darf keinen zweiten Stunden-Server neben der Suite starten.
services:
  db:
    image: postgres:16
    container_name: stunden-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stunden
      POSTGRES_PASSWORD: stunden_dev_passwort
      POSTGRES_DB: stunden
    ports:
      # Nur lokal am Rechner erreichbar (Entwicklung), nicht im LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
