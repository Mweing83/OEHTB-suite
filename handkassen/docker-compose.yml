# Handkassen - NUR Entwicklungs-Datenbank.
#
# Der Produktivbetrieb laeuft ausschliesslich ueber die OEHTB-Suite
# (docker-compose.yml im Suite-Root, Profil "produktion"). Diese Datei
# startet lediglich eine lokale PostgreSQL-Instanz fuer "npm run dev",
# genau wie bei Stunden und Foerderungen:
#
#   docker compose up -d        (im Ordner handkassen\)
#
# Bewusst KEIN App-/Backup-Dienst und KEIN benanntes Volume mehr: Die
# Produktivdaten der Suite liegen in den Docker-Volumes handkassen_db_data /
# handkassen_belege_data. Diese Datei kann sie nicht mehr beruehren.
services:
  db:
    image: postgres:16-alpine
    container_name: handkassen-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: handkassen
      POSTGRES_PASSWORD: handkassen_dev_passwort
      POSTGRES_DB: handkassen
    ports:
      # Nur lokal am Rechner erreichbar (Entwicklung), nicht im LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handkassen"]
      interval: 5s
      timeout: 5s
      retries: 5
